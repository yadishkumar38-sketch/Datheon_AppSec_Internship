<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cvssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="950" height="320" rx="16" fill="url(#bgGrad4)" stroke="#334155" stroke-width="2"/>

  <!-- Left Score Box -->
  <g transform="translate(40, 40)" filter="url(#shadow4)">
    <rect width="240" height="240" rx="14" fill="#2a1205" stroke="#f97316" stroke-width="2"/>
    <text x="120" y="45" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="700" fill="#fed7aa">
      CVSS v3.1 BASE SCORE
    </text>
    <circle cx="120" cy="120" r="50" fill="url(#cvssGrad)"/>
    <text x="120" y="132" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="900" fill="#ffffff">
      7.5
    </text>
    <text x="120" y="195" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="800" fill="#f97316">
      HIGH SEVERITY
    </text>
    <text x="120" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fdba74">
      OWASP API1:2023 · BOLA/IDOR
    </text>
  </g>

  <!-- Right Vector Metrics Breakdown -->
  <g transform="translate(310, 40)">
    <text x="0" y="25" font-family="monospace" font-size="13" font-weight="700" fill="#38bdf8">
      Vector: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    </text>

    <!-- Metrics Grid -->
    <g transform="translate(0, 45)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="140" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="10" y="22" font-family="sans-serif" font-size="10" fill="#94a3b8">Attack Vector (AV)</text>
      <text x="10" y="45" font-family="sans-serif" font-size="14" font-weight="700" fill="#ef4444">Network (N)</text>

      <rect x="150" y="0" width="140" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="160" y="22" font-family="sans-serif" font-size="10" fill="#94a3b8">Attack Complexity (AC)</text>
      <text x="160" y="45" font-family="sans-serif" font-size="14" font-weight="700" fill="#ef4444">Low (L)</text>

      <rect x="300" y="0" width="140" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="310" y="22" font-family="sans-serif" font-size="10" fill="#94a3b8">Privileges Required (PR)</text>
      <text x="310" y="45" font-family="sans-serif" font-size="14" font-weight="700" fill="#ef4444">None (N)</text>

      <rect x="450" y="0" width="140" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="460" y="22" font-family="sans-serif" font-size="10" fill="#94a3b8">User Interaction (UI)</text>
      <text x="460" y="45" font-family="sans-serif" font-size="14" font-weight="700" fill="#ef4444">None (N)</text>

      <!-- Row 2 -->
      <rect x="0" y="80" width="140" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="10" y="102" font-family="sans-serif" font-size="10" fill="#94a3b8">Scope (S)</text>
      <text x="10" y="125" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Unchanged (U)</text>

      <rect x="150" y="80" width="140" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="160" y="102" font-family="sans-serif" font-size="10" fill="#94a3b8">Confidentiality (C)</text>
      <text x="160" y="125" font-family="sans-serif" font-size="14" font-weight="700" fill="#ef4444">High (H)</text>

      <rect x="300" y="80" width="140" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="310" y="102" font-family="sans-serif" font-size="10" fill="#94a3b8">Integrity (I)</text>
      <text x="310" y="125" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981">None (N)</text>

      <rect x="450" y="80" width="140" height="65" rx="6" fill="#1e293b" stroke="#475569"/>
      <text x="460" y="102" font-family="sans-serif" font-size="10" fill="#94a3b8">Availability (A)</text>
      <text x="460" y="125" font-family="sans-serif" font-size="14" font-weight="700" fill="#10b981">None (N)</text>
    </g>
    <text x="0" y="215" font-family="sans-serif" font-size="11" fill="#94a3b8">
      Calculated per FIRST.org CVSS v3.1 Specification · CWE-639 Authorization Bypass Through User-Controlled Key
    </text>
  </g>
</svg>
