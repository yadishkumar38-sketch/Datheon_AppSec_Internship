<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="950" height="480" rx="16" fill="url(#bgGrad2)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="475" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    🔐 CRYPTOGRAPHIC SESSION SECURITY &amp; HTTP-ONLY COOKIE DEFENSE
  </text>
  <text x="475" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    Eliminating XSS Token Theft via HttpOnly, SameSite=Lax, HMAC-SHA256 &amp; Sliding Window Rate Limiting
  </text>

  <!-- Step 1: Login Request -->
  <g transform="translate(50, 110)" filter="url(#shadow2)">
    <rect width="250" height="150" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="250" height="35" rx="10" fill="#3b82f6"/>
    <text x="125" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      1. CLIENT AUTHENTICATION
    </text>
    <text x="20" y="65" font-family="monospace" font-size="11" fill="#93c5fd">POST /api/v2/auth/login</text>
    <text x="20" y="85" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Email: alice@datheon-intern.org</text>
    <text x="20" y="103" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Password Credentials</text>
    <text x="20" y="125" font-family="sans-serif" font-size="10" fill="#60a5fa">→ Transmitted over TLS/HTTPS</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 310 185 L 340 185" stroke="#60a5fa" stroke-width="3"/>

  <!-- Step 2: Backend Cryptographic Minting -->
  <g transform="translate(350, 110)" filter="url(#shadow2)">
    <rect width="260" height="150" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="260" height="35" rx="10" fill="url(#purpleGrad)"/>
    <text x="130" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      2. TOKEN SIGNING &amp; SET-COOKIE
    </text>
    <text x="15" y="65" font-family="sans-serif" font-size="11" fill="#c4b5fd">✓ Verify Password Hash</text>
    <text x="15" y="85" font-family="sans-serif" font-size="11" fill="#c4b5fd">✓ Sign HMAC-SHA256 JWT</text>
    <text x="15" y="105" font-family="monospace" font-size="10" fill="#a78bfa">Set-Cookie: datheon_session</text>
    <text x="15" y="123" font-family="sans-serif" font-size="10" fill="#34d399">🛡️ HttpOnly; Secure; SameSite=Lax</text>
    <text x="15" y="137" font-family="sans-serif" font-size="9" fill="#fca5a5">🚫 Document.cookie cannot read (No XSS)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 620 185 L 650 185" stroke="#8b5cf6" stroke-width="3"/>

  <!-- Step 3: Protected Request Flow -->
  <g transform="translate(660, 110)" filter="url(#shadow2)">
    <rect width="240" height="150" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="240" height="35" rx="10" fill="#10b981"/>
    <text x="120" y="24" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      3. GUARD VALIDATION
    </text>
    <text x="15" y="65" font-family="monospace" font-size="11" fill="#a7f3d0">GET /api/v2/dashboard/:id</text>
    <text x="15" y="85" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Cookie automatically sent</text>
    <text x="15" y="103" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Verify HS256 Signature</text>
    <text x="15" y="121" font-family="sans-serif" font-size="11" fill="#cbd5e1">• Check Expiry Lifetime (1h)</text>
    <text x="15" y="137" font-family="sans-serif" font-size="9" fill="#34d399">✅ Authorized session context established</text>
  </g>

  <!-- Bottom Panel: Sliding Window Rate Limiting -->
  <g transform="translate(50, 290)" filter="url(#shadow2)">
    <rect width="850" height="145" rx="12" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="850" height="32" rx="12" fill="url(#cyanGrad)"/>
    <text x="425" y="22" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#ffffff">
      ⚡ SLIDING WINDOW RATE LIMITER &amp; ANTI-FUZZING DEFENSE
    </text>
    <text x="30" y="60" font-family="monospace" font-size="11" fill="#67e8f9">
      Headers Injected on Every Request:
    </text>
    <text x="45" y="80" font-family="monospace" font-size="11" fill="#e2e8f0">
      X-RateLimit-Limit: 15  |  X-RateLimit-Remaining: 14  |  X-RateLimit-Reset: 1732279200
    </text>
    <text x="30" y="105" font-family="sans-serif" font-size="11" fill="#cbd5e1">
      When an attacker fuzzes 15+ rapid requests: sliding window counter triggers <tspan font-family="monospace" fill="#f87171">HTTP 429 Too Many Requests</tspan> with <tspan font-family="monospace" fill="#f87171">Retry-After: 60</tspan>.
    </text>
    <text x="30" y="125" font-family="sans-serif" font-size="10" fill="#94a3b8">
      Mitigates: OWASP API4:2023 Unrestricted Resource Consumption &amp; Automated ID Enumeration.
    </text>
  </g>
</svg>
