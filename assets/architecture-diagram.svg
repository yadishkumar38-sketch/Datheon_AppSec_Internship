<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="950" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title Header -->
  <text x="475" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    🛡️ OWASP API1:2023 BOLA / IDOR vs. ZERO-TRUST ARCHITECTURE
  </text>
  <text x="475" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    Datheon Application Security &amp; API Pentesting Internship · Researcher: Yadish Kumar (ID: DT-2026-7ZENR)
  </text>

  <!-- LEFT: Vulnerable Flow -->
  <g transform="translate(40, 100)" filter="url(#shadow)">
    <rect width="410" height="340" rx="12" fill="#1e1e2e" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="0" y="0" width="410" height="40" rx="12" fill="url(#redGrad)"/>
    <text x="205" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      ❌ VULNERABLE ARCHITECTURE (API v1)
    </text>

    <!-- Attacker Node -->
    <rect x="30" y="60" width="350" height="55" rx="8" fill="#2d3748" stroke="#4a5568"/>
    <text x="45" y="85" font-family="monospace" font-size="12" font-weight="600" fill="#fca5a5">
      Attacker / User A (No Session Cookie)
    </text>
    <text x="45" y="103" font-family="monospace" font-size="11" fill="#e2e8f0">
      GET /api/v1/dashboard?appId=DT-2026-002
    </text>

    <!-- Arrow Down -->
    <path d="M 205 115 L 205 145" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="215" y="135" font-family="sans-serif" font-size="10" fill="#ef4444">Blind Parameter Passing</text>

    <!-- Naive Backend -->
    <rect x="30" y="150" width="350" height="65" rx="8" fill="#2d3748" stroke="#ef4444"/>
    <text x="45" y="175" font-family="monospace" font-size="12" font-weight="600" fill="#f87171">
      Backend Route Handler
    </text>
    <text x="45" y="195" font-family="monospace" font-size="11" fill="#cbd5e1">
      db.query("SELECT * WHERE id = :appId")
    </text>
    <text x="45" y="210" font-family="sans-serif" font-size="10" fill="#fca5a5">
      ⚠️ Missing auth verification &amp; ownership check
    </text>

    <!-- Arrow Down -->
    <path d="M 205 215 L 205 245" stroke="#ef4444" stroke-width="2"/>

    <!-- Data Exfiltration -->
    <rect x="30" y="250" width="350" height="65" rx="8" fill="#3b1d28" stroke="#ef4444"/>
    <text x="45" y="273" font-family="sans-serif" font-size="12" font-weight="700" fill="#f87171">
      🚨 CRITICAL IDOR / BOLA EXPLOITATION:
    </text>
    <text x="45" y="293" font-family="monospace" font-size="11" fill="#fecaca">
      Returns User B's PII, Email, Phone &amp; Private Grades
    </text>
    <text x="45" y="307" font-family="sans-serif" font-size="10" fill="#f87171">
      Status: HTTP 200 OK (CVSS 7.5 High Severity)
    </text>
  </g>

  <!-- RIGHT: Hardened Zero-Trust Flow -->
  <g transform="translate(500, 100)" filter="url(#shadow)">
    <rect width="410" height="340" rx="12" fill="#132320" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="410" height="40" rx="12" fill="url(#greenGrad)"/>
    <text x="205" y="26" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#ffffff">
      ✅ HARDENED ZERO-TRUST DEFENSE (API v2)
    </text>

    <!-- Authenticated Request Node -->
    <rect x="30" y="60" width="350" height="55" rx="8" fill="#1b3832" stroke="#047857"/>
    <text x="45" y="85" font-family="monospace" font-size="12" font-weight="600" fill="#a7f3d0">
      User A (Alice - USR-101)
    </text>
    <text x="45" y="103" font-family="monospace" font-size="11" fill="#e2e8f0">
      Cookie: HttpOnly datheon_secure_session
    </text>

    <!-- Arrow Down -->
    <path d="M 205 115 L 205 145" stroke="#10b981" stroke-width="2"/>

    <!-- Defensive Auth Guard & Compound DB -->
    <rect x="30" y="145" width="350" height="85" rx="8" fill="#1b3832" stroke="#10b981"/>
    <text x="45" y="167" font-family="monospace" font-size="12" font-weight="600" fill="#6ee7b7">
      Defensive authGuard &amp; Compound Query
    </text>
    <text x="45" y="185" font-family="monospace" font-size="11" fill="#cbd5e1">
      1. Verify HMAC-SHA256 Token Signature
    </text>
    <text x="45" y="200" font-family="monospace" font-size="11" fill="#cbd5e1">
      2. Compound Filter: (id = :appId AND owner = :userId)
    </text>
    <text x="45" y="217" font-family="sans-serif" font-size="10" fill="#34d399">
      🛡️ Reject unauthorized access gracefully
    </text>

    <!-- Split Arrows for Own vs Cross-Tenant -->
    <path d="M 120 230 L 90 260" stroke="#10b981" stroke-width="2"/>
    <path d="M 290 230 L 320 260" stroke="#ef4444" stroke-width="2"/>

    <!-- Own Resource -->
    <rect x="20" y="260" width="170" height="60" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="30" y="282" font-family="sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">Own Resource</text>
    <text x="30" y="300" font-family="monospace" font-size="10" fill="#e2e8f0">HTTP 200 OK</text>
    <text x="30" y="313" font-family="sans-serif" font-size="9" fill="#a7f3d0">Data safely returned</text>

    <!-- Cross Resource Attempt -->
    <rect x="220" y="260" width="170" height="60" rx="8" fill="#450a0a" stroke="#ef4444"/>
    <text x="230" y="282" font-family="sans-serif" font-size="11" font-weight="700" fill="#f87171">BOLA Attempt</text>
    <text x="230" y="300" font-family="monospace" font-size="10" fill="#fca5a5">HTTP 403 Forbidden</text>
    <text x="230" y="313" font-family="sans-serif" font-size="9" fill="#fecaca">Zero DB leakage</text>
  </g>
</svg>
