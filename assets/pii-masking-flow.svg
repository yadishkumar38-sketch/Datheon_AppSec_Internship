<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="950" height="420" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="475" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc">
    🛡️ PUBLIC ENDPOINT SHIELDING &amp; ZERO-PII DATA MASKING
  </text>
  <text x="475" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#94a3b8">
    Safe Verification of Credentials (e.g. DT-2026-7ZENR) without Exposing Sensitive Personal Information
  </text>

  <!-- Left: Database Raw Record -->
  <g transform="translate(40, 100)" filter="url(#shadow3)">
    <rect width="260" height="280" rx="10" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect width="260" height="35" rx="10" fill="#475569"/>
    <text x="130" y="23" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      RAW INTERNAL DATABASE RECORD
    </text>
    <text x="15" y="60" font-family="monospace" font-size="10" fill="#94a3b8">appId: "DT-2026-7ZENR"</text>
    <text x="15" y="85" font-family="monospace" font-size="10" fill="#f87171">name: "Yadish Kumar"</text>
    <text x="15" y="110" font-family="monospace" font-size="10" fill="#f87171">email: "yadishkumar38@gmail.com"</text>
    <text x="15" y="135" font-family="monospace" font-size="10" fill="#f87171">phone: "+91-98765-43210"</text>
    <text x="15" y="160" font-family="monospace" font-size="10" fill="#cbd5e1">status: "Active &amp; In Progress"</text>
    <text x="15" y="185" font-family="monospace" font-size="10" fill="#f87171">grade: "Outstanding"</text>
    <text x="15" y="210" font-family="monospace" font-size="9" fill="#f87171">notes: "Candidate verified..."</text>
    <text x="15" y="250" font-family="sans-serif" font-size="10" fill="#ef4444">⚠️ Contains Private &amp; PII Data</text>
  </g>

  <!-- Middle: Dynamic Shielding Engine -->
  <g transform="translate(340, 100)" filter="url(#shadow3)">
    <rect width="270" height="280" rx="10" fill="#1e1e38" stroke="#3b82f6" stroke-width="2"/>
    <rect width="270" height="35" rx="10" fill="url(#shieldGrad)"/>
    <text x="135" y="23" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      🛡️ ZERO-LEAKAGE MASKING PIPELINE
    </text>
    <text x="15" y="65" font-family="sans-serif" font-size="11" font-weight="600" fill="#60a5fa">1. Dynamic Email Masking</text>
    <text x="25" y="85" font-family="monospace" font-size="10" fill="#cbd5e1">j***e@domain.com algorithm</text>

    <text x="15" y="115" font-family="sans-serif" font-size="11" font-weight="600" fill="#60a5fa">2. Phone Redaction</text>
    <text x="25" y="135" font-family="monospace" font-size="10" fill="#cbd5e1">+XX-XXX-XXX-3210</text>

    <text x="15" y="165" font-family="sans-serif" font-size="11" font-weight="600" fill="#60a5fa">3. Name Anonymization</text>
    <text x="25" y="185" font-family="monospace" font-size="10" fill="#cbd5e1">First char + '*' masks</text>

    <text x="15" y="215" font-family="sans-serif" font-size="11" font-weight="600" fill="#60a5fa">4. Field Stripping</text>
    <text x="25" y="235" font-family="sans-serif" font-size="10" fill="#fca5a5">Purges confidential notes &amp; grades</text>

    <text x="15" y="260" font-family="sans-serif" font-size="10" fill="#34d399">✓ CSP, HSTS &amp; Anti-Clickjack Headers</text>
  </g>

  <!-- Right: Masked Public Return -->
  <g transform="translate(650, 100)" filter="url(#shadow3)">
    <rect width="260" height="280" rx="10" fill="#132320" stroke="#10b981" stroke-width="2"/>
    <rect width="260" height="35" rx="10" fill="#10b981"/>
    <text x="130" y="23" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">
      PUBLIC SANITIZED PAYLOAD
    </text>
    <text x="15" y="60" font-family="monospace" font-size="10" fill="#a7f3d0">appId: "DT-2026-7ZENR"</text>
    <text x="15" y="85" font-family="monospace" font-size="10" fill="#6ee7b7">student: "Y****** K****"</text>
    <text x="15" y="110" font-family="monospace" font-size="10" fill="#6ee7b7">email: "y***********8@gmail.com"</text>
    <text x="15" y="135" font-family="monospace" font-size="10" fill="#6ee7b7">phone: "+XX-XXX-XXX-3210"</text>
    <text x="15" y="160" font-family="monospace" font-size="10" fill="#a7f3d0">status: "Active &amp; In Progress"</text>
    <text x="15" y="185" font-family="monospace" font-size="10" fill="#6ee7b7">badge: "VERIFIED_CREDENTIAL"</text>
    <text x="15" y="220" font-family="sans-serif" font-size="10" fill="#34d399">✅ Safe for Public Lookup</text>
    <text x="15" y="240" font-family="sans-serif" font-size="9" fill="#94a3b8">Zero Personally Identifiable Info Leaked</text>
  </g>
</svg>
